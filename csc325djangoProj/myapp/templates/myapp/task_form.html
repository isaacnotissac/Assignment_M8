<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Create a task</title>
</head>
<body>
    <main>
        <h1>Create a task</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save task</button>
        </form>
        <p><a href="{% url 'task-list' %}">Back to tasks</a></p>
    </main>
</body>
</html>
