name: CSC325 Django CI/CD

on:
  push:
    branches:
      - main

jobs:
  Setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

  Dependencies:
    name: Dependencies
    needs: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

  Test:
    name: Test
    needs: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python manage.py test
        working-directory: csc325djangoProj

  Deploy:
    name: Deploy
    needs: Test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application
        run: echo "Deploying the application..."